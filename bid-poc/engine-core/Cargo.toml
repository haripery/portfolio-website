[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "I/O-free bidding logic shared by server-node (via engine-napi) and server-rust"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# gzip request/response bodies for the OpenRTB endpoint (OpenRTB 2.6 section 2.4); default miniz_oxide backend
flate2 = "1.1.11"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "openrtb"
harness = false
